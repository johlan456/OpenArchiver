#!/usr/sbin/nft -f
# Open Archiver host firewall.
# Installed to /etc/nftables.conf by install.sh; loaded by the nftables init script.
#
# Why this exists: the Express backend binds :4000 on ALL interfaces (upstream
# code, additive-only fork — we do not patch it). On a host with a global IPv6
# address that would be internet-reachable. Default-drop inbound; only SSH and
# Caddy (80/443) are exposed.

flush ruleset

table inet filter {
	chain input {
		type filter hook input priority filter; policy drop;

		ct state established,related accept
		ct state invalid drop

		iif "lo" accept

		# ICMP is not optional on IPv6 (ND, PMTUD); keep v4 ping too
		ip protocol icmp accept
		meta l4proto ipv6-icmp accept

		# DHCPv6 client
		udp dport 546 accept

		tcp dport { 22, 80, 443 } accept
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
	}

	chain output {
		type filter hook output priority filter; policy accept;
	}
}
