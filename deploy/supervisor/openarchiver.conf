; Open Archiver — 5 app processes under supervisor.
; Installed verbatim to /etc/supervisor/conf.d/openarchiver.conf (no secrets here;
; secrets live in /srv/openarchiver/.env, sourced by oa-run.sh).
; Restart everything: supervisorctl restart openarchiver:*

[program:oa-backend]
command=/srv/openarchiver/deploy/bin/oa-run.sh backend
directory=/srv/openarchiver
user=openarchiver
environment=HOME="/srv/openarchiver",USER="openarchiver"
stdout_logfile=/var/log/openarchiver/backend.log
stderr_logfile=/var/log/openarchiver/backend.log
autostart=true
autorestart=true
startsecs=10
startretries=3
stopasgroup=true
killasgroup=true

[program:oa-frontend]
command=/srv/openarchiver/deploy/bin/oa-run.sh frontend
directory=/srv/openarchiver
user=openarchiver
environment=HOME="/srv/openarchiver",USER="openarchiver"
stdout_logfile=/var/log/openarchiver/frontend.log
stderr_logfile=/var/log/openarchiver/frontend.log
autostart=true
autorestart=true
startsecs=10
startretries=3
stopasgroup=true
killasgroup=true

[program:oa-ingestion]
command=/srv/openarchiver/deploy/bin/oa-run.sh ingestion-worker
directory=/srv/openarchiver
user=openarchiver
environment=HOME="/srv/openarchiver",USER="openarchiver"
stdout_logfile=/var/log/openarchiver/ingestion.log
stderr_logfile=/var/log/openarchiver/ingestion.log
autostart=true
autorestart=true
startsecs=10
startretries=3
; workers drain in-flight jobs on SIGTERM — give them time
stopwaitsecs=60
stopasgroup=true
killasgroup=true

[program:oa-indexing]
command=/srv/openarchiver/deploy/bin/oa-run.sh indexing-worker
directory=/srv/openarchiver
user=openarchiver
environment=HOME="/srv/openarchiver",USER="openarchiver"
stdout_logfile=/var/log/openarchiver/indexing.log
stderr_logfile=/var/log/openarchiver/indexing.log
autostart=true
autorestart=true
startsecs=10
startretries=3
stopwaitsecs=60
stopasgroup=true
killasgroup=true

[program:oa-scheduler]
command=/srv/openarchiver/deploy/bin/oa-run.sh sync-scheduler
directory=/srv/openarchiver
user=openarchiver
environment=HOME="/srv/openarchiver",USER="openarchiver"
stdout_logfile=/var/log/openarchiver/scheduler.log
stderr_logfile=/var/log/openarchiver/scheduler.log
autostart=true
autorestart=true
startsecs=10
startretries=3
stopasgroup=true
killasgroup=true

[group:openarchiver]
programs=oa-backend,oa-frontend,oa-ingestion,oa-indexing,oa-scheduler
