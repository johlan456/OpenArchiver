; Caddy under supervisor — follows the house pattern (see deploy/DEPLOY.md).
; Installed verbatim to /etc/supervisor/conf.d/caddy.conf.
; Requires: /usr/local/bin/caddy with cap_net_bind_service (set by install.sh),
; /etc/caddy/CaddyEnv (rendered by install.sh), /var/log/caddy owned by www-data.

[program:caddy]
command=/usr/local/bin/caddy run --config /etc/caddy/Caddyfile --envfile /etc/caddy/CaddyEnv --environ
environment=HOME=/etc/caddy/ssl
directory=/etc/caddy
user=www-data
stdout_logfile=/var/log/caddy/caddy.log
stderr_logfile=/var/log/caddy/caddy.log
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=600
startretries=3
